# Nguồn. Mỗi nghĩa ghi `sources: [<mã>, ...]` hoặc `sources: [{id: <mã>, url: ..., note: ...}]`.
#
# Trạng thái kiểm chứng của một nghĩa được tính từ số nguồn ĐỘC LẬP:
#   verified  : từ 2 nguồn độc lập trở lên
#   pending   : 1 nguồn (chờ nguồn thứ hai)
#   unsourced : chưa có nguồn nào
# Hai nguồn chép của nhau tính là một: nguồn sau ghi `same_as: <mã nguồn gốc>`.
# Nguồn chỉ ghi xuất xứ, không dùng để kiểm chứng, ghi `counts: false`.
#
# <mã>:
#   name:    tên nguồn
#   kind:    dictionary | web | press | article | book | speaker | provenance
#   url:     (tùy chọn)
#   license: (tùy chọn) chỉ ghi khi đã chép nội dung của nguồn vô repo
#   same_as: (tùy chọn)
#   counts:  (tùy chọn, mặc định true)
#   note:    (tùy chọn)

wiktionary:
  name: Wiktionary (tiếng Anh)
  kind: dictionary
  url: https://en.wiktionary.org/
  license: CC BY-SA 4.0
  note: >-
    Nhập qua bản JSON của wiktextract (kaikki.org), bản dump ngày 2026-10-30.
    Mỗi nghĩa nhập về ghi url trang Wiktionary để ghi công tác giả theo CC BY-SA.

contributor:
  name: Người đóng góp đưa ra hoặc xác nhận
  kind: speaker
  note: >-
    Ghi ngày và hoàn cảnh trong `note` của nguồn (VD. {id: contributor, note: "đưa ra khi duyệt, 2026-11-19"}).
    Không ghi tên, số điện thoại hay địa chỉ.

