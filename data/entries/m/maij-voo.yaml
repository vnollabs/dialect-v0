spelling: mại vô
etymologies:
  - type: loan
    lang: zh
    source_form: 賣
    note:
      en: Chinese 賣 /卖 (mài, “to sell”) + vô (imperatively intensifying particle).
    pos:
      - pos: intj
        senses:
          - gloss:
              en: come and check out and buy my/our stuff, folks!
            region: [south]
            labels: [humorous]
            examples:
              - text: Mại vô bà con ơi, xoài cát mới hái ngọt lịm nè!
                standard: Mời vào mua đi bà con ơi, xoài cát mới hái ngọt lịm đây!
                ai_draft: true
            sources:
              - id: wiktionary
                url: https://en.wiktionary.org/wiki/m%E1%BA%A1i_v%C3%B4#Vietnamese
