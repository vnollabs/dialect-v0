    pos:
      - pos: noun
        senses:
          - gloss:
              en: policeman during the French colonial period
            region: [south]
            labels: [historical]
            examples:
              - text: Ông ngoại kể hồi đó thấy mã tà đi ngang là con nít chạy trốn hết.
                standard: Ông ngoại kể hồi đó thấy mã tà đi ngang là trẻ con chạy trốn hết.
                ai_draft: true
            sources:
