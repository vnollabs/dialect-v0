      - pos: noun
        han_nom: [𤀕]
        senses:
          - gloss:
              en: (con~) eardrum, earhole
            region: [central, south]
            synonyms: [lá nhĩ, lỗ tai]
            examples:
              - text: – Ừa, nghe khoái con ráy rồi, mai mốt dẫn tụi tao đi coi chân cẳng họ nghe, mầy!
                en: – Ye, hearing it was a pleasure to our ear[hole]s, someday you need to take us go and watch those legs [of the soccer players] in action!
                ref: "1970, Duyên Anh, Mặt trời nhỏ: Truyện dài [The little sun: a long novel], Saigon: Tuổi Ngọc, page 118:"
