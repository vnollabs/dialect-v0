spelling: lộn
etymologies:
  - pos:
      - senses:
          - gloss:
              vi: Nhầm
            region: [south]
            standard: [nhầm]
            examples:
              - text: Nói lộn nói lại, đi lộn đường
            topics: [actions]
            sources: [skill-dictionary-v1]
  - note:
      en: |-
        Related to trộn (“to mix”).
        Often compared to Chinese 亂 (MC lwanH).
    pos:
      - pos: verb
        han_nom: [論, 侖]
        senses:
          - gloss:
              en: to mix up; to confuse
            region: [south]
            labels: [colloquial]
            examples:
              - text: Mấy xấp giấy tờ của tui bị tụi nhỏ làm lộn hết, kiếm hổng ra.
                standard: Mấy xấp giấy tờ của tôi bị bọn trẻ làm lẫn lộn hết, tìm không ra.
                ai_draft: true
            sources:
              - id: wiktionary
                url: https://en.wiktionary.org/wiki/l%E1%BB%99n#Vietnamese
          - gloss:
              en: to do by mistake; to be mistaken
            region: [south]
            labels: [colloquial]
            examples:
              - text: lộn tiệm
                en: to go to the wrong store
            sources:
              - id: wiktionary
                url: https://en.wiktionary.org/wiki/l%E1%BB%99n#Vietnamese
