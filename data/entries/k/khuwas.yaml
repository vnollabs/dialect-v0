spelling: khứa
etymologies:
  - type: sino
    han: 鋸
    note:
      en: "Non-Sino-Vietnamese reading of Chinese 鋸 (“saw; to saw off”, SV: cứ). Related to cứa, cưa."
    pos:
      - pos: verb
        senses:
          - gloss:
              en: to cut little by little; to saw off
            region: [central, south]
            synonyms: [cứa]
            examples:
              - text: Ông lấy con dao lụt khứa hoài mà sợi dây chão hổng đứt.
                standard: Ông lấy con dao cùn cứa mãi mà sợi dây thừng không đứt.
                ai_draft: true
            sources:
              - id: wiktionary
                url: https://en.wiktionary.org/wiki/kh%E1%BB%A9a#Vietnamese
      - pos: noun
        senses:
          - gloss:
              en: cut; slice; piece from cutting
            region: [south]
            examples:
              - text: Má chiên mấy khứa cá thu, ăn với cơm trắng bắt cơm lắm.
                standard: Mẹ rán mấy khoanh cá thu, ăn với cơm trắng đưa cơm lắm.
                ai_draft: true
            sources:
              - id: wiktionary
                url: https://en.wiktionary.org/wiki/kh%E1%BB%A9a#Vietnamese
  - note:
