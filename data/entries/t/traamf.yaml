                url: https://en.wiktionary.org/wiki/tr%E1%BA%A7m#Vietnamese
          - gloss:
              en: to drown oneself
            region: [south]
            sources:
              - id: wiktionary
                url: https://en.wiktionary.org/wiki/tr%E1%BA%A7m#Vietnamese
            note: "No example yet: the AI drafter skipped this sense (unclear standalone use of trầm as 'drown oneself' distinct from trầm mình; suicide sense hard to make natural and inoffensive). Check that the sense is real before adding one."
