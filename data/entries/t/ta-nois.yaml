spelling: ta nói
etymologies:
  - pos:
      - senses:
          - gloss:
              vi: Cụm chen sau chủ đề để nhấn mạnh, trầm trồ, như 'phải nói là' (let me tell you); hay đi với 'nó' nhắc lại chủ đề và 'làm sao / gì đâu / hết biết' cuối câu
            region: [south]
            examples:
              - text: Mà món ăn ở miền Tây ta nói nó ngon làm sao
            topics: [discourse-markers]
            sources:
