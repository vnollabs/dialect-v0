            topics: [mekong-words]
            sources: [skill-dictionary-v1]
  - pos:
      - pos: adj
        senses:
          - gloss:
              en: futile, anticlimactic, having turned out to be useless
            region: [south]
            labels: [colloquial]
            examples:
              - text: Chạy lên tận huyện xin giấy, tới nơi người ta nghỉ, trớt quớt.
                standard: Chạy lên tận huyện xin giấy, đến nơi người ta nghỉ, công cốc.
