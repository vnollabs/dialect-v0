        senses:
          - gloss:
              en: Vietnamese rice cake made from non-glutinous rice flour. It takes the form of gelatinous blocks that are often colored green by the addition of Pandanus amaryllifolius leaf extract.
            region: [south]
            examples:
              - text: Sáng nay má mua mấy miếng bánh đúc lá dứa xanh lè, ăn mát ruột ghê.
                standard: Sáng nay mẹ mua mấy miếng bánh đúc lá dứa xanh lét, ăn mát ruột lắm.
