spelling: bang bang
etymologies:
  - pos:
      - pos: adv
        senses:
          - gloss:
              en: without caring about one's environment or surrounding
            region: [south]
            examples:
              - text: Trưa trời trưa trật làm gì đi bang bang ngoài đường vậy ông nội?
                en: It's high noon, what are you doing going around looking like you don't have a care for this world?
            sources:
              - id: wiktionary
                url: https://en.wiktionary.org/wiki/bang_bang#Vietnamese
