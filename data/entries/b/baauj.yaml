            region: [central, south]
            labels: [endearing]
            examples:
              - text: Bậu ở nhà coi con nghen, chiều anh đi bán lúa về sớm.
                standard: Em ở nhà trông con nhé, chiều anh đi bán lúa về sớm.
                ai_draft: true
            sources:
