spelling: bo xì
etymologies:
  - pos:
      - pos: verb
        senses:
          - gloss:
              en: to stop hanging out with; to not play with anymore
            region: [south]
            labels: [childish]
            synonyms: [cắt xít, hít le]
            examples:
              - text: Lêu lêu bo xì, chơi một mình đi nha.
                en: Boo, I don't feel like playing with you anymore, play by yourself!
            sources:
              - id: wiktionary
                url: https://en.wiktionary.org/wiki/bo_x%C3%AC#Vietnamese
