            synonyms: [bánh khô]
            examples:
              - text: Mấy bữa nắng tốt, bà ngoại tráng bánh tráng phơi đầy sân.
                standard: Mấy hôm nắng tốt, bà ngoại tráng bánh đa phơi đầy sân.
                ai_draft: true
            sources:
