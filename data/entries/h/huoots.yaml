                ai_draft: true
              - text: Mải nói chuyện, tui chạy huốt qua nhà bà Ba hồi nào hổng hay.
                standard: Mải nói chuyện, tôi đi vượt quá nhà bà Ba lúc nào không biết.
                ai_draft: true
            topics: [mekong-words]
            sources: [skill-dictionary-v1]
