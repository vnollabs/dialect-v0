spelling: hiền
etymologies:
  - type: sino
    han: 賢
    note:
      en: Sino-Vietnamese word from 賢 (“able; talented, virtuous; decent, good-natured, kind”).
    pos:
      - pos: adj
        han_nom: [賢, 贒, 䝨]
        senses:
          - gloss:
              en: ingenuous
            region: [south]
            labels: [euphemistic]
            examples:
              - text: Em hiền quá à! Vậy thì sao có bồ được?
                en: You're too ingenuous! How can you get a girlfriend?
            sources:
              - id: wiktionary
                url: https://en.wiktionary.org/wiki/hi%E1%BB%81n#Vietnamese
          - gloss:
              en: innocuous, harmless, nutritious, healthy
            qualifier: of foods
            region: [south]
            examples:
              - text: Bữa nay ăn canh rau tập tàng cho nó hiền, giải nhiệt mùa nắng.
                standard: Hôm nay ăn canh rau tập tàng cho nó lành, giải nhiệt mùa nắng.
            sources:
              - id: wiktionary
                url: https://en.wiktionary.org/wiki/hi%E1%BB%81n#Vietnamese
