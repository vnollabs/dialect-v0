spelling: hoài
etymologies:
  - pos:
      - pos: adv
        senses:
          - gloss:
              en: ceaselessly, constantly, all the time
            region: [central, south]
            synonyms: [mãi, riết, miết]
            examples:
              - text: Rồi nó nghẹn ngào, "Còn tui, người ta đã quăng ở đây mười tám năm, tui chờ hoài mà có ai tìm đâu…"
                en: Then she said in a choked voice, "And me, they left me here eighteen years ago; I've been waiting forever but nobody has come looking for me…"
                ref: "2005, Nguyễn Ngọc Tư, “Ơi Cải về đâu”, in Cánh đồng bất tận, NXB Trẻ:"
            sources:
              - id: wiktionary
                url: https://en.wiktionary.org/wiki/ho%C3%A0i#Vietnamese
