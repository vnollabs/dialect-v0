spelling: xế
etymologies:
  - derived: [bữa xế, xế chiều]
    pos:
      - pos: noun
        han_nom: [熾, 𪰮, 制]
        senses:
          - gloss:
              en: early afternoon, about 2–3 pm
            region: [south]
            examples:
              - text: bữa xế
                en: a light meal or a snack during this time
            sources:
              - id: wiktionary
                url: https://en.wiktionary.org/wiki/x%E1%BA%BF#Vietnamese
  - note:
      en: Perhaps from tài xế (“driver”), influenced by xe (“vehicle”).
    derived: [quái xế, xế điếc, xế độp, xế hộp]
    pos:
      - pos: noun
        han_nom: [車]
        senses:
          - gloss:
              en: wheeled vehicle
            region: [central, south]
            labels: [slang]
            synonyms: [xe]
            examples:
              - text: Chiều nay cho tao mượn chiếc xế đi công chuyện chút nghen.
                standard: Chiều nay cho tao mượn chiếc xe đi công việc một chút nhé.
                ai_draft: true
            sources:
              - id: wiktionary
                url: https://en.wiktionary.org/wiki/x%E1%BA%BF#Vietnamese
