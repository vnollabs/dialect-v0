spelling: xí
etymologies:
  - pos:
      - pos: noun
        senses:
          - gloss:
              en: tiny bit; a little bit
            region: [central, south]
            examples:
              - text: Chờ tui một xí, tui ra liền.
                standard: Chờ tôi một chút, tôi ra ngay.
                ai_draft: true
            sources:
              - id: wiktionary
                url: https://en.wiktionary.org/wiki/x%C3%AD#Vietnamese
  - type: loan
    lang: yue
    source_form: 死
    note:
      en: Borrowed from Cantonese 死.
    derived: [xấu xí]
    pos:
      - pos: intj
        senses:
          - gloss:
              en: "Indicating mild discontent or disgust: ugh! huh! fie! hell!"
            region: [south]
            examples:
              - text: Xí, ai thèm đồ của mấy người!
                standard: Hứ, ai thèm đồ của các người!
                ai_draft: true
            sources:
              - id: wiktionary
                url: https://en.wiktionary.org/wiki/x%C3%AD#Vietnamese
      - pos: adj
        senses:
          - gloss:
              en: ugly; unattractive
            region: [south]
            examples:
              - text: Mới cắt tóc ngắn, nó soi gương rồi kêu xí quá trời.
                standard: Mới cắt tóc ngắn, nó soi gương rồi kêu xấu quá.
                ai_draft: true
            sources:
              - id: wiktionary
                url: https://en.wiktionary.org/wiki/x%C3%AD#Vietnamese
