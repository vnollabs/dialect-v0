spelling: quăng
etymologies:
  - pos:
      - senses:
          - gloss:
              vi: Vứt
            region: [south]
            standard: [vứt]
            synonyms: [liệng]
            examples:
              - text: Đồ cũ hổng xài nữa thì quăng đi cho rộng nhà.
                standard: Đồ cũ không dùng nữa thì vứt đi cho rộng nhà.
                ai_draft: true
            topics: [actions]
            sources: [skill-dictionary-v1]
  - note:
      en: |-
        Cognate with Arem kwaŋ, Khasi kawang (“to throw, hurl”). Ultimately of imitative origin, compare English wang.
        See also quẳng and văng.
    pos:
      - pos: verb
        han_nom: [𫽶]
        senses:
          - gloss:
              en: to throw away; to toss out
            region: [central, south]
            examples:
              - text: Mấy cái thau bể hết rồi, quăng ra ngoài đi cho rộng nhà.
                standard: Mấy cái chậu vỡ hết rồi, vứt ra ngoài đi cho rộng nhà.
                ai_draft: true
            sources:
              - id: wiktionary
                url: https://en.wiktionary.org/wiki/qu%C4%83ng#Vietnamese
