spelling: áp
etymologies:
  - type: sino
    han: 壓
    note:
      en: Sino-Vietnamese word from 壓. Compare ép, ẹp.
    pos:
      - pos: verb
        senses:
          - gloss:
              en: to be next to; to be close to
            region: [central, south]
            examples:
              - text: áp chót
                en: next to last; second last
            sources:
              - id: wiktionary
                url: https://en.wiktionary.org/wiki/%C3%A1p#Vietnamese
