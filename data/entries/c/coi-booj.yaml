            region: [south, central]
            labels: [colloquial]
            synonyms: [có vẻ]
            examples:
              - text: Mây đen kéo tới nghẹt trời, coi bộ chiều nay mưa lớn à nghen
                standard: Mây đen kéo đến kín trời, xem ra chiều nay mưa to đấy nhé
            topics: [discourse-markers]
            sources:
              - skill-dictionary-v1
