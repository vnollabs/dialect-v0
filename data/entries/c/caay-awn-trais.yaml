spelling: cây ăn trái
etymologies:
  - type: compound
    note:
      en: cây + ăn + trái.
    pos:
      - pos: noun
        senses:
          - gloss:
              en: fruit tree
            region: [south-central, south]
            synonyms: [cây ăn quả]
            examples:
              - text: Đất miệt vườn màu mỡ nên trồng cây ăn trái tốt um, trái quằn nhánh.
                standard: Đất miệt vườn màu mỡ nên trồng cây ăn quả rất tốt, quả trĩu cành.
            sources:
              - id: wiktionary
                url: https://en.wiktionary.org/wiki/c%C3%A2y_%C4%83n_tr%C3%A1i#Vietnamese
