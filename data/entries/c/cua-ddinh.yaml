            qualifier: Mekong Delta
            region: [mekong-delta]
            synonyms: [ba ba Nam Bộ]
            examples:
              - text: Đám giỗ năm nay ba mua con cua đinh về nấu cháo đậu xanh.
                standard: Đám giỗ năm nay bố mua con ba ba về nấu cháo đậu xanh.
