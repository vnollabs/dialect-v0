spelling: chị Hai
etymologies:
  - pos:
      - pos: noun
        senses:
          - gloss:
              vi: Chị cả trong gia đình Nam Bộ (con đầu gọi là Hai); còn dùng gọi thân mật người nữ trạc tuổi
              en: eldest sister; also used as a friendly form of address to an adult female
            region: [south]
            standard: [chị cả]
            examples:
              - text: Chị Hai lấy chồng xa, Tết mới về thăm má với mấy đứa em.
                standard: Chị cả lấy chồng xa, Tết mới về thăm mẹ với mấy đứa em.
                ai_draft: true
            topics: [family-address]
            sources: [skill-dictionary-v1]
