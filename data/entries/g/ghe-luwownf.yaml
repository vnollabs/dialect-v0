spelling: ghe lườn
etymologies:
  - type: compound
    note:
      en: ghe + lườn.
    pos:
      - pos: noun
        classifiers: [cái, chiếc]
        senses:
          - gloss:
              vi: Thuyền độc mộc đáy thon dài khoét từ thân cây gỗ, chuyên chèo chống trong kinh rạch cạn hẹp
              en: dugout boat or canoe, a narrow wooden boat hollowed from a tree trunk for small waterways
            qualifier: Mekong Delta
            region: [mekong-delta]
            examples:
              - text: Ông Sáu chống ghe lườn len lỏi trong rạch nhỏ đi giăng câu.
                standard: Ông Sáu chống thuyền nhỏ len lỏi trong lạch nhỏ đi giăng câu.
                ai_draft: true
              - text: Hồi nhỏ tui hay bơi ghe lườn qua sông đi học.
                standard: Hồi nhỏ tôi hay chèo thuyền con qua sông đi học.
                ai_draft: true
            topics: [mekong-words]
            sources:
              - skill-dictionary-v1
              - id: wiktionary
                url: https://en.wiktionary.org/wiki/ghe_l%C6%B0%E1%BB%9Dn#Vietnamese
