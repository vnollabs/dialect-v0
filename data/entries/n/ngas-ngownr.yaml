spelling: ngá ngởn
etymologies:
  - pos:
      - pos: adv
        senses:
          - gloss:
              en: carelessly; without paying much attention or regard to one's surrounding
            region: [south]
            examples:
              - text: Đi đứng ngá ngởn kiểu gì mà giờ té giập mặt rồi thấy chưa.
                en: How careless you got to be at walking that you got yourself injured so bad after just a fall.
            sources:
              - id: wiktionary
                url: https://en.wiktionary.org/wiki/ng%C3%A1_ng%E1%BB%9Fn#Vietnamese
