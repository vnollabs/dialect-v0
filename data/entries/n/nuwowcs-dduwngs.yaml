spelling: nước đứng
etymologies:
  - pos:
      - pos: noun
        senses:
          - gloss:
              vi: Lúc hoặc chỗ con nước đứng lại, gần như không chảy, giữa lúc nước lớn và nước ròng
            region: [mekong-delta]
            examples:
              - text: …chớ chẳng mắc mớ gì phải thả lưới bén ở cái khúc vàm nước đứng này.
                standard: …chứ chẳng việc gì phải thả lưới ở cái khúc cửa sông nước đứng này.
            topics: [mekong-words]
            sources:
              - id: contributor
                note: Người dùng đưa ra trong truyện mẫu Khúc Vàm Nước Đứng, 2026-11-19
